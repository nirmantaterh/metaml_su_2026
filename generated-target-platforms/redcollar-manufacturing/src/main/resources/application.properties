spring.application.name=TargetPlatform

server.port=8080

# =============================================================================
# Actuator - manage endpoints
# =============================================================================
management.endpoints.web.exposure.include=*
management.endpoint.shutdown.enabled=true
endpoints.shutdown.enabled=true

# =============================================================================
# JPA / Hibernate
# =============================================================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
##(create, update, create-drop, validate)
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=update

# =============================================================================
# Camunda Primary DataSource Configuration - H2DB
# =============================================================================
spring.datasource.url=jdbc:h2:mem:camunda;DB_CLOSE_DELAY=-1
spring.datasource.camunda.url=jdbc:h2:mem:process-engine;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.camunda.username=sa
spring.datasource.camunda.password=
spring.datasource.camunda.driver-class-name=org.h2.Driver
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# =============================================================================
# Camunda Process Engine Configuration
# =============================================================================
camunda.bpm.process-engine-name=engine
camunda.bpm.database-schema-update=true
camunda.bpm.skip-isolation-level-check=true
camunda.bpm.history-level=full
camunda.bpm.enforce-history-time-to-live=false
camunda.bpm.job-executor-activate=false
# (ORIGINAL) camunda.bpm.enforce-history-time-to-live=true

# Camunda Webapp
camunda.bpm.webapp.enabled=true
camunda.bpm.admin-user.id=admin
camunda.bpm.admin-user.password=admin
camunda.bpm.admin-user.firstName=Admin
camunda.bpm.admin-user.lastName=Admin

# Location of BPMN process files
camunda.bpm.deployment-resource-pattern=classpath*:/processes/*.bpmn

# The standalone Target Platform serves its OWN portal at "/" (src/main/resources/static).
# Camunda web app starter otherwise redirects "/" to its welcome app, which would hide it.
# Cockpit/Tasklist/Admin stay exactly where they are, under /camunda.
camunda.bpm.webapp.index-redirect-enabled=false

# Disable Camunda historyTimeToLive enforcement for dynamic process definitions.
camunda.bpm.generic-properties.properties.enforceHistoryTimeToLive=false

# =============================================================================
# RabbitMQ
# =============================================================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=2000
spring.rabbitmq.listener.simple.retry.max-attempts=30
spring.rabbitmq.listener.simple.retry.multiplier=1.0
spring.rabbitmq.listener.simple.retry.max-interval=10000
# Route rejected messages to Dead Letter Queue after max attempts.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# Simple publisher confirms and returns for synchronous RabbitTemplate publish operations.
spring.rabbitmq.publisher-confirm-type=simple
spring.rabbitmq.publisher-returns=true

# =============================================================================
# MetaML Target Platform
# =============================================================================
# Enable proxy-twin message synchronization over RabbitMQ broker.
metaml.messaging.enabled=true

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="arch-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Component Box Gradients -->
    <linearGradient id="box-metaml" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="box-tp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c2d48" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="box-mq" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c1a0e" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Header Accent Gradients -->
    <linearGradient id="purple-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="blue-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="orange-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <!-- Pattern -->
    <pattern id="arch-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.5"/>
    </pattern>

    <!-- Arrow Marker Definitions -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fb923c" />
    </marker>
  </defs>

  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .card-title { font-size: 14px; font-weight: 700; letter-spacing: 0.5px; fill: #f8fafc; }
    .item-title { font-size: 11.5px; font-weight: 600; fill: #e2e8f0; }
    .item-desc { font-size: 10px; fill: #94a3b8; }
    .badge-text { font-size: 9px; font-weight: 700; letter-spacing: 0.6px; }
    .flow-label { font-size: 9px; font-weight: 700; fill: #94a3b8; }
  </style>

  <!-- Canvas Container -->
  <rect width="1180" height="620" rx="14" fill="url(#arch-bg)" stroke="#1e293b" stroke-width="1.2"/>
  <rect width="1180" height="620" rx="14" fill="url(#arch-grid)"/>

  <!-- Top Title / Architecture Header -->
  <g transform="translate(32, 22)">
    <rect x="0" y="0" width="130" height="22" rx="11" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="0.8"/>
    <circle cx="11" cy="11" r="3.5" fill="#a855f7"/>
    <text x="22" y="15" class="mono badge-text" fill="#c084fc">ARCHITECTURE</text>

    <text x="144" y="16" class="sans" font-size="14" font-weight="700" fill="#f8fafc">MetaML Architectural &amp; Runtime Model</text>
    <text x="470" y="16" class="mono" font-size="10" fill="#64748b">Authoring Control Plane • Standalone Microservice Runtime • External AMQP Transport</text>
  </g>

  <!-- =================================================== -->
  <!-- 1. METAML WORKBENCH (Left: Host / Control Plane)     -->
  <!-- =================================================== -->
  <g transform="translate(32, 56)">
    <rect width="520" height="540" rx="10" fill="url(#box-metaml)" stroke="#4338ca" stroke-width="1.2"/>
    <rect width="520" height="3" rx="1.5" fill="url(#purple-bar)"/>

    <!-- Header Badge -->
    <rect x="18" y="14" width="148" height="20" rx="10" fill="#2e1065" stroke="#8b5cf6" stroke-width="0.8"/>
    <text x="92" y="27" class="mono badge-text" fill="#c084fc" text-anchor="middle">AUTHORING &amp; CONTROL</text>
    <text x="178" y="29" class="sans card-title">MetaML Workbench</text>
    <text x="18" y="50" class="sans" font-size="10.5" fill="#94a3b8">
      Integrated modeling, process persistence, project generation, and runtime supervision plane.
    </text>

    <!-- Subsystem 1: UI / BPMN Modeling Canvas -->
    <g transform="translate(18, 64)">
      <rect width="484" height="84" rx="7" fill="#090d16" stroke="#312e81" stroke-width="0.9"/>
      <rect x="12" y="10" width="118" height="16" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.6"/>
      <text x="71" y="21" class="mono badge-text" fill="#a5b4fc" text-anchor="middle">UI &amp; MODELING</text>
      <text x="140" y="22" class="sans item-title">BPMN 2.0 Modeler Canvas</text>
      <text x="404" y="21" class="mono" font-size="9" fill="#818cf8">Port 3000</text>
      <text x="14" y="42" class="sans item-desc">• Interactive bpmn-js canvas with component palette, properties panel, and validation</text>
      <text x="14" y="58" class="sans item-desc">• Transmute Studio: Model, Save, Generate, and Launch process workflows</text>
      <text x="14" y="74" class="sans item-desc">• Project / Process workspace management and twin mapping inspection</text>
    </g>

    <!-- Subsystem 2: Process Storage & Catalog -->
    <g transform="translate(18, 158)">
      <rect width="484" height="76" rx="7" fill="#090d16" stroke="#312e81" stroke-width="0.9"/>
      <rect x="12" y="10" width="134" height="16" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.6"/>
      <text x="79" y="21" class="mono badge-text" fill="#a5b4fc" text-anchor="middle">PROCESS STORAGE</text>
      <text x="156" y="22" class="sans item-title">wbapi Control Plane</text>
      <text x="404" y="21" class="mono" font-size="9" fill="#818cf8">Port 8082</text>
      <text x="14" y="42" class="sans item-desc">• Process catalog persistence, definition versioning, and H2 archive database</text>
      <text x="14" y="58" class="sans item-desc">• BPMN 2.0 validation, executable deployment verification, and workflow state tracker</text>
    </g>

    <!-- Subsystem 3: Generation Engine -->
    <g transform="translate(18, 244)">
      <rect width="484" height="86" rx="7" fill="#090d16" stroke="#312e81" stroke-width="0.9"/>
      <rect x="12" y="10" width="118" height="16" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.6"/>
      <text x="71" y="21" class="mono badge-text" fill="#a5b4fc" text-anchor="middle">CODE GENERATION</text>
      <text x="140" y="22" class="sans item-title">SpringBootProjectGenerator</text>
      <text x="14" y="42" class="sans item-desc">• Clones production template (`RedCollarTP`) into standalone Spring Boot application</text>
      <text x="14" y="58" class="sans item-desc">• Specializes `pom.xml`, port configuration, and Camunda properties</text>
      <text x="14" y="74" class="sans item-desc">• Synthesizes external task workers, delegates, and AMQP event listeners</text>
    </g>

    <!-- Subsystem 4: Runtime Supervision -->
    <g transform="translate(18, 340)">
      <rect width="484" height="86" rx="7" fill="#090d16" stroke="#312e81" stroke-width="0.9"/>
      <rect x="12" y="10" width="144" height="16" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.6"/>
      <text x="84" y="21" class="mono badge-text" fill="#a5b4fc" text-anchor="middle">RUNTIME MANAGEMENT</text>
      <text x="166" y="22" class="sans item-title">SpringBootProjectLauncher</text>
      <text x="14" y="42" class="sans item-desc">• Spawns generated Target Platform as a supervised child JVM process</text>
      <text x="14" y="58" class="sans item-desc">• Automatically assigns dynamic TCP ports via `ServerSocket(0)` and polls readiness</text>
      <text x="14" y="74" class="sans item-desc">• Manages lifecycle: start, stop, port discovery, and supervision state</text>
    </g>

    <!-- Subsystem 5: Authoring Catalog / Node Manager -->
    <g transform="translate(18, 436)">
      <rect width="484" height="84" rx="7" fill="#090d16" stroke="#312e81" stroke-width="0.9"/>
      <rect x="12" y="10" width="134" height="16" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.6"/>
      <text x="79" y="21" class="mono badge-text" fill="#a5b4fc" text-anchor="middle">AUTHORING CATALOG</text>
      <text x="156" y="22" class="sans item-title">nodemanager Service</text>
      <text x="404" y="21" class="mono" font-size="9" fill="#818cf8">Port 8083</text>
      <text x="14" y="42" class="sans item-desc">• Authoring-time agent discovery and capability catalog stub</text>
      <text x="14" y="58" class="sans item-desc">• Exposes capability declarations and contracts during modeling and evolution</text>
      <text x="14" y="74" class="sans item-desc" fill="#64748b">• Consulted by Workbench during design; not in Target Platform runtime execution path</text>
    </g>
  </g>

  <!-- =================================================== -->
  <!-- PIPELINE FLOW: Workbench -> Generated Target Platform -->
  <!-- =================================================== -->
  <g transform="translate(552, 168)">
    <path d="M 0 0 L 44 0" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#arrow-blue)"/>
    <rect x="-10" y="-22" width="64" height="16" rx="3" fill="#090d16" stroke="#0284c7" stroke-width="0.7"/>
    <text x="22" y="-11" class="mono flow-label" text-anchor="middle" fill="#38bdf8">GENERATE</text>

    <path d="M 0 84 L 44 84" stroke="#34d399" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#arrow-green)"/>
    <rect x="-10" y="62" width="64" height="16" rx="3" fill="#090d16" stroke="#10b981" stroke-width="0.7"/>
    <text x="22" y="73" class="mono flow-label" text-anchor="middle" fill="#34d399">LAUNCH</text>
  </g>

  <!-- =================================================== -->
  <!-- 2. GENERATED TARGET PLATFORM (Right: Standalone App) -->
  <!-- =================================================== -->
  <g transform="translate(604, 56)">
    <rect width="544" height="394" rx="10" fill="url(#box-tp)" stroke="#0284c7" stroke-width="1.2"/>
    <rect width="544" height="3" rx="1.5" fill="url(#blue-bar)"/>

    <!-- Header Badge -->
    <rect x="18" y="14" width="168" height="20" rx="10" fill="#082f49" stroke="#0284c7" stroke-width="0.8"/>
    <text x="102" y="27" class="mono badge-text" fill="#7dd3fc" text-anchor="middle">STANDALONE MICROSERVICE</text>
    <text x="198" y="29" class="sans card-title">Generated Target Platform</text>
    <text x="18" y="50" class="sans" font-size="10.5" fill="#94a3b8">
      Independent Spring Boot application. Runs autonomously with embedded Camunda engine and portal.
    </text>

    <!-- Sub-container A: Single Shared Camunda Engine -->
    <g transform="translate(18, 64)">
      <rect width="508" height="120" rx="7" fill="#090d16" stroke="#0c4a6e" stroke-width="0.9"/>
      <rect x="12" y="8" width="154" height="15" rx="3" fill="#082f49" stroke="#0284c7" stroke-width="0.6"/>
      <text x="89" y="19" class="mono badge-text" fill="#7dd3fc" text-anchor="middle">EMBEDDED CAMUNDA 7.24</text>
      <text x="176" y="20" class="sans item-title">Shared Process Engine Runtime</text>

      <!-- Dual Workflows inside the single engine -->
      <g transform="translate(12, 30)">
        <!-- Proxy Process -->
        <rect width="234" height="78" rx="5" fill="#0c1e33" stroke="#0284c7" stroke-width="0.8"/>
        <text x="10" y="18" class="sans item-title" fill="#38bdf8">Proxy Process (Production)</text>
        <text x="10" y="34" class="sans item-desc">• Deployed BPMN production workflow</text>
        <text x="10" y="48" class="sans item-desc">• Executes user tasks &amp; external service calls</text>
        <text x="10" y="62" class="sans item-desc" fill="#7dd3fc">• Pauses at sync catch signals</text>

        <!-- Digital Twin Process -->
        <g transform="translate(248, 0)">
          <rect width="234" height="78" rx="5" fill="#082924" stroke="#10b981" stroke-width="0.8"/>
          <text x="10" y="18" class="sans item-title" fill="#34d399">Digital Twin (Automated)</text>
          <text x="10" y="34" class="sans item-desc">• Mirrored BPMN definition (`*twin.bpmn`)</text>
          <text x="10" y="48" class="sans item-desc">• Correlated by shared `businessKey`</text>
          <text x="10" y="62" class="sans item-desc" fill="#6ee7b7">• Executes automated capabilities</text>
        </g>
      </g>
    </g>

    <!-- Sub-container B: Capability Execution Layer -->
    <g transform="translate(18, 192)">
      <rect width="508" height="66" rx="7" fill="#090d16" stroke="#0c4a6e" stroke-width="0.9"/>
      <rect x="12" y="8" width="144" height="15" rx="3" fill="#082f49" stroke="#0284c7" stroke-width="0.6"/>
      <text x="84" y="19" class="mono badge-text" fill="#7dd3fc" text-anchor="middle">CAPABILITY DISPATCHER</text>
      <text x="166" y="20" class="sans item-title">Pluggable Component Execution Layer</text>
      <text x="12" y="38" class="sans item-desc">• `CapabilityDispatcher` evaluates bindings and dispatches tasks to `ComponentExecutor`</text>
      <text x="12" y="52" class="sans item-desc">• Reference providers: OrderApproval, QualityCheck, Validator, Notifier, Recommender</text>
    </g>

    <!-- Sub-container C: Coordination & AMQP Adapters -->
    <g transform="translate(18, 266)">
      <rect width="508" height="74" rx="7" fill="#090d16" stroke="#c2410c" stroke-width="0.9"/>
      <rect x="12" y="8" width="168" height="15" rx="3" fill="#431407" stroke="#ea580c" stroke-width="0.6"/>
      <text x="96" y="19" class="mono badge-text" fill="#fdba74" text-anchor="middle">COORDINATION &amp; MESSAGING</text>
      <text x="190" y="20" class="sans item-title">Lockstep Coordination Logic</text>
      <text x="12" y="38" class="sans item-desc">• `PairRegistry` pairs instances; `SignalBroadcaster` (1s coordinator) discovers subscriptions</text>
      <text x="12" y="52" class="sans item-desc">• `TaskQueuePublisher` &amp; `ResponseQueuePublisher` emit AMQP messages to RabbitMQ</text>
      <text x="12" y="66" class="sans item-desc" fill="#fb923c">• `TaskQueueListener` &amp; `ResponseQueueListener` consume events to release Camunda signals</text>
    </g>

    <!-- Sub-container D: Standalone Management Portal -->
    <g transform="translate(18, 348)">
      <rect width="508" height="36" rx="6" fill="#090d16" stroke="#0c4a6e" stroke-width="0.8"/>
      <text x="12" y="18" class="mono" font-size="9" font-weight="700" fill="#38bdf8">STANDALONE PORTAL</text>
      <text x="156" y="18" class="sans" font-size="10" fill="#e2e8f0">Web UI (Port :PORT) • Dual BPMN Visualizer • Live AMQP Audit Log</text>
    </g>
  </g>

  <!-- =================================================== -->
  <!-- FLOW: Target Platform <--> RabbitMQ (External)      -->
  <!-- =================================================== -->
  <g transform="translate(730, 450)">
    <!-- Outward publish arrow -->
    <path d="M 0 0 L 0 46" stroke="#f97316" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#arrow-orange)"/>
    <rect x="-84" y="14" width="76" height="16" rx="3" fill="#090d16" stroke="#ea580c" stroke-width="0.6"/>
    <text x="-46" y="25" class="mono" font-size="8.5" font-weight="600" fill="#fdba74" text-anchor="middle">1. Task Publish</text>

    <!-- Inward consume arrow -->
    <path d="M 170 46 L 170 0" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#arrow-green)"/>
    <rect x="180" y="14" width="94" height="16" rx="3" fill="#090d16" stroke="#059669" stroke-width="0.6"/>
    <text x="227" y="25" class="mono" font-size="8.5" font-weight="600" fill="#6ee7b7" text-anchor="middle">2. Response Consume</text>
  </g>

  <!-- =================================================== -->
  <!-- 3. RABBITMQ MESSAGE BROKER (Bottom: External)       -->
  <!-- =================================================== -->
  <g transform="translate(604, 500)">
    <rect width="544" height="96" rx="10" fill="url(#box-mq)" stroke="#ea580c" stroke-width="1.2"/>
    <rect width="544" height="3" rx="1.5" fill="url(#orange-bar)"/>

    <!-- Header Badge -->
    <rect x="18" y="12" width="160" height="18" rx="9" fill="#431407" stroke="#ea580c" stroke-width="0.8"/>
    <text x="98" y="24" class="mono badge-text" fill="#fdba74" text-anchor="middle">EXTERNAL INFRASTRUCTURE</text>
    <text x="188" y="26" class="sans card-title">RabbitMQ Message Broker (AMQP)</text>
    <text x="526" y="25" class="mono" font-size="9" fill="#fb923c" text-anchor="end">Port 5672 • 15672</text>

    <!-- Broker Details -->
    <g transform="translate(18, 38)">
      <rect width="508" height="46" rx="5" fill="#090d16" stroke="#431407" stroke-width="0.8"/>
      <text x="12" y="17" class="mono item-title" fill="#fed7aa">Topic Exchange &amp; Correlation Queues</text>
      <text x="12" y="31" class="sans item-desc">RabbitMQ provides external asynchronous AMQP transport for task and response handoff messages.</text>
      <text x="12" y="43" class="sans item-desc" fill="#fdba74">Durable project exchange (`*.exchange`), task queues (`sync.*`), response queues (`sync.responses.*`), and DLQ.</text>
    </g>
  </g>
</svg>

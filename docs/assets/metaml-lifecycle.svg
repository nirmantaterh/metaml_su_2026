<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 260" width="100%" height="100%">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="lf-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Stage Card Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="c1-acc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="c2-acc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="c3-acc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="c4-acc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="c5-acc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <filter id="lf-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="lf-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title { font-size: 13.5px; font-weight: 700; letter-spacing: 0.5px; }
    .desc { font-size: 11px; fill: #94a3b8; line-height: 1.45; }
    .badge { font-size: 9.5px; font-weight: 600; letter-spacing: 0.5px; }
  </style>

  <!-- Container Box -->
  <rect width="1160" height="260" rx="14" fill="url(#lf-bg)" stroke="#1e293b" stroke-width="1.2"/>
  <rect width="1160" height="260" rx="14" fill="url(#lf-grid)"/>

  <!-- Card 1: 1. MODEL -->
  <g transform="translate(24, 25)">
    <rect width="200" height="210" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
    <rect width="200" height="4" rx="2" fill="url(#c1-acc)"/>
    <rect x="14" y="18" width="56" height="20" rx="10" fill="#2e1065" stroke="#8b5cf6" stroke-width="0.8"/>
    <text x="42" y="32" class="mono badge" fill="#c084fc" text-anchor="middle">STEP 01</text>
    
    <text x="14" y="66" class="sans title" fill="#f8fafc">1. Model</text>
    <text x="14" y="86" class="mono" font-size="10.5" font-weight="600" fill="#c084fc">BPMN 2.0 Canvas</text>

    <text x="14" y="116" class="sans desc">
      <tspan x="14" dy="0">Visual workflow authoring</tspan>
      <tspan x="14" dy="16">and configuration on canvas</tspan>
      <tspan x="14" dy="16">with property inspection</tspan>
      <tspan x="14" dy="16">and validation.</tspan>
    </text>

    <rect x="14" y="174" width="172" height="22" rx="4" fill="#090d16" stroke="#1e293b"/>
    <text x="24" y="189" class="mono" font-size="9" fill="#94a3b8">Input: .bpmn XML / UI</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 228 130 L 244 130" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="3 3"/>
  <polygon points="244,127 250,130 244,133" fill="#8b5cf6"/>

  <!-- Card 2: 2. SAVE -->
  <g transform="translate(254, 25)">
    <rect width="200" height="210" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
    <rect width="200" height="4" rx="2" fill="url(#c2-acc)"/>
    <rect x="14" y="18" width="56" height="20" rx="10" fill="#1e1b4b" stroke="#a855f7" stroke-width="0.8"/>
    <text x="42" y="32" class="mono badge" fill="#d8b4fe" text-anchor="middle">STEP 02</text>
    
    <text x="14" y="66" class="sans title" fill="#f8fafc">2. Save</text>
    <text x="14" y="86" class="mono" font-size="10.5" font-weight="600" fill="#a5b4fc">Process Catalog</text>

    <text x="14" y="116" class="sans desc">
      <tspan x="14" dy="0">Validate executable BPMN,</tspan>
      <tspan x="14" dy="16">verify engine deployment,</tspan>
      <tspan x="14" dy="16">and persist to catalog</tspan>
      <tspan x="14" dy="16">archive.</tspan>
    </text>

    <rect x="14" y="174" width="172" height="22" rx="4" fill="#090d16" stroke="#1e293b"/>
    <text x="24" y="189" class="mono" font-size="9" fill="#94a3b8">Storage: H2 Database</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 458 130 L 474 130" stroke="#6366f1" stroke-width="2" stroke-dasharray="3 3"/>
  <polygon points="474,127 480,130 474,133" fill="#6366f1"/>

  <!-- Card 3: 3. GENERATE -->
  <g transform="translate(484, 25)">
    <rect width="200" height="210" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
    <rect width="200" height="4" rx="2" fill="url(#c3-acc)"/>
    <rect x="14" y="18" width="56" height="20" rx="10" fill="#082f49" stroke="#6366f1" stroke-width="0.8"/>
    <text x="42" y="32" class="mono badge" fill="#a5b4fc" text-anchor="middle">STEP 03</text>
    
    <text x="14" y="66" class="sans title" fill="#f8fafc">3. Generate</text>
    <text x="14" y="86" class="mono" font-size="10.5" font-weight="600" fill="#818cf8">Target Platform</text>

    <text x="14" y="116" class="sans desc">
      <tspan x="14" dy="0">Scaffold standalone</tspan>
      <tspan x="14" dy="16">Spring Boot project with</tspan>
      <tspan x="14" dy="16">embedded Camunda engine</tspan>
      <tspan x="14" dy="16">and messaging code.</tspan>
    </text>

    <rect x="14" y="174" width="172" height="22" rx="4" fill="#090d16" stroke="#1e293b"/>
    <text x="24" y="189" class="mono" font-size="9" fill="#94a3b8">Output: Standalone Project</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 688 130 L 704 130" stroke="#0284c7" stroke-width="2" stroke-dasharray="3 3"/>
  <polygon points="704,127 710,130 704,133" fill="#0284c7"/>

  <!-- Card 4: 4. LAUNCH -->
  <g transform="translate(714, 25)">
    <rect width="200" height="210" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
    <rect width="200" height="4" rx="2" fill="url(#c4-acc)"/>
    <rect x="14" y="18" width="56" height="20" rx="10" fill="#0c2d48" stroke="#0284c7" stroke-width="0.8"/>
    <text x="42" y="32" class="mono badge" fill="#7dd3fc" text-anchor="middle">STEP 04</text>
    
    <text x="14" y="66" class="sans title" fill="#f8fafc">4. Launch</text>
    <text x="14" y="86" class="mono" font-size="10.5" font-weight="600" fill="#38bdf8">Supervised Runtime</text>

    <text x="14" y="116" class="sans desc">
      <tspan x="14" dy="0">Build and start application</tspan>
      <tspan x="14" dy="16">as child JVM process on</tspan>
      <tspan x="14" dy="16">assigned dynamic port with</tspan>
      <tspan x="14" dy="16">health probes.</tspan>
    </text>

    <rect x="14" y="174" width="172" height="22" rx="4" fill="#090d16" stroke="#1e293b"/>
    <text x="24" y="189" class="mono" font-size="9" fill="#94a3b8">Runtime: Child JVM / Port</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 918 130 L 934 130" stroke="#10b981" stroke-width="2" stroke-dasharray="3 3"/>
  <polygon points="934,127 940,130 934,133" fill="#10b981"/>

  <!-- Card 5: 5. RUN -->
  <g transform="translate(944, 25)">
    <rect width="192" height="210" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
    <rect width="192" height="4" rx="2" fill="url(#c5-acc)"/>
    <rect x="14" y="18" width="56" height="20" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
    <text x="42" y="32" class="mono badge" fill="#6ee7b7" text-anchor="middle">STEP 05</text>
    
    <text x="14" y="66" class="sans title" fill="#f8fafc">5. Run</text>
    <text x="14" y="86" class="mono" font-size="10.5" font-weight="600" fill="#34d399">Proxy ⇄ Twin</text>

    <text x="14" y="116" class="sans desc">
      <tspan x="14" dy="0">Execute workflows in</tspan>
      <tspan x="14" dy="16">lockstep via external</tspan>
      <tspan x="14" dy="16">RabbitMQ transport with</tspan>
      <tspan x="14" dy="16">capability execution.</tspan>
    </text>

    <rect x="14" y="174" width="164" height="22" rx="4" fill="#090d16" stroke="#1e293b"/>
    <text x="24" y="189" class="mono" font-size="9" fill="#94a3b8">Transport: RabbitMQ AMQP</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="hero-bg-glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="1.0"/>
    </radialGradient>
    <radialGradient id="purple-flare" cx="20%" cy="40%" r="35%">
      <stop offset="0%" stop-color="#57068c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#57068c" stop-opacity="0.0"/>
    </radialGradient>
    <radialGradient id="cyan-flare" cx="80%" cy="40%" r="35%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Linear Accents -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f1f5f9"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="pip-active" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .hero-title { font-weight: 800; letter-spacing: -1px; }
    .hero-tag { font-weight: 500; letter-spacing: 0.5px; }
    .step-text { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; fill: #94a3b8; }
    .step-active { fill: #f8fafc; font-weight: 700; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="440" rx="16" fill="url(#hero-bg-glow)"/>
  <rect width="1200" height="440" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="440" rx="16" fill="url(#purple-flare)"/>
  <rect width="1200" height="440" rx="16" fill="url(#cyan-flare)"/>
  <rect width="1200" height="440" rx="16" fill="none" stroke="url(#border-grad)" stroke-width="1.5"/>

  <!-- Top Badges / Subsystem Header -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="148" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="13" cy="13" r="4" fill="#8b5cf6"/>
    <text x="25" y="17" class="mono" font-size="11" fill="#c7d2fe" font-weight="600">RESEARCH CORE</text>

    <rect x="158" y="0" width="168" height="26" rx="13" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="171" cy="13" r="4" fill="#38bdf8"/>
    <text x="183" y="17" class="mono" font-size="11" fill="#bae6fd" font-weight="600">SPRING BOOT 4 + JDK 24</text>
  </g>

  <!-- Main Branding / Typography -->
  <g transform="translate(60, 120)">
    <text x="0" y="32" class="sans hero-title" font-size="46" fill="url(#title-grad)">MetaML Workbench</text>
    <text x="0" y="70" class="sans" font-size="21" font-weight="400" fill="#e2e8f0" letter-spacing="-0.2px">
      Design a process once. Generate an executable platform around it.
    </text>
    <text x="0" y="98" class="sans" font-size="21" font-weight="600" fill="#38bdf8" letter-spacing="-0.2px">
      Keep its Proxy and Twin synchronized at runtime.
    </text>

    <text x="0" y="140" class="sans hero-tag" font-size="14.5" fill="#94a3b8">
      Model-driven BPMN workbench for generating and running synchronized Spring Boot/Camunda
    </text>
    <text x="0" y="162" class="sans hero-tag" font-size="14.5" fill="#94a3b8">
      Proxy-Twin platforms with RabbitMQ event bus and pluggable AI capabilities.
    </text>
  </g>

  <!-- Right Motif: Infinite Sync / Proxy ↔ Twin Emblem -->
  <g transform="translate(930, 175)">
    <!-- Ambient Pulse Background -->
    <circle cx="0" cy="0" r="110" fill="#1e1b4b" fill-opacity="0.25" filter="url(#subtle-glow)"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.2"/>

    <!-- Left Loop: Proxy -->
    <path d="M -70 0 C -70 -45, -25 -45, 0 0 C 25 45, 70 45, 70 0 C 70 -45, 25 -45, 0 0 C -25 45, -70 45, -70 0 Z"
          fill="none" stroke="#6366f1" stroke-width="4" stroke-linecap="round" filter="url(#subtle-glow)"/>
    <!-- Right Loop Overlay -->
    <path d="M 0 0 C 25 45, 70 45, 70 0 C 70 -45, 25 -45, 0 0"
          fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

    <!-- Synchronizing Event Orbit Nodes -->
    <g transform="translate(-48, -25)">
      <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
      <text x="0" y="4" class="mono" font-size="9" font-weight="700" fill="#e0e7ff" text-anchor="middle">PRX</text>
    </g>

    <g transform="translate(48, 25)">
      <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="0" y="4" class="mono" font-size="9" font-weight="700" fill="#e0f2fe" text-anchor="middle">TWN</text>
    </g>

    <!-- Center Bridge (RabbitMQ Synced) -->
    <circle cx="0" cy="0" r="8" fill="#f97316"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-opacity="0.8"/>

    <!-- Labels under Motif -->
    <text x="0" y="75" class="mono" font-size="11" font-weight="700" fill="#cbd5e1" text-anchor="middle" letter-spacing="1px">PROXY ⇄ TWIN</text>
    <text x="0" y="92" class="mono" font-size="9.5" fill="#f97316" text-anchor="middle" letter-spacing="0.5px">AMQP EVENT BUS</text>
  </g>

  <!-- Bottom Pipeline Bar: MODEL → GENERATE → LAUNCH → SYNCHRONIZE → EVOLVE -->
  <g transform="translate(60, 360)">
    <!-- Bar Container -->
    <rect x="0" y="0" width="1080" height="48" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Stage 1: MODEL -->
    <g transform="translate(24, 15)">
      <circle cx="10" cy="9" r="6" fill="#8b5cf6"/>
      <text x="24" y="13" class="mono step-text step-active">1. MODEL</text>
      <text x="88" y="13" class="sans" font-size="11" fill="#64748b">BPMN 2.0</text>
    </g>
    <path d="M 195 24 L 215 24" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Stage 2: GENERATE -->
    <g transform="translate(235, 15)">
      <circle cx="10" cy="9" r="6" fill="#6366f1"/>
      <text x="24" y="13" class="mono step-text step-active">2. GENERATE</text>
      <text x="110" y="13" class="sans" font-size="11" fill="#64748b">Spring Boot TP</text>
    </g>
    <path d="M 440 24 L 460 24" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Stage 3: LAUNCH -->
    <g transform="translate(480, 15)">
      <circle cx="10" cy="9" r="6" fill="#0284c7"/>
      <text x="24" y="13" class="mono step-text step-active">3. LAUNCH</text>
      <text x="96" y="13" class="sans" font-size="11" fill="#64748b">Camunda 7.24</text>
    </g>
    <path d="M 675 24 L 695 24" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Stage 4: SYNCHRONIZE -->
    <g transform="translate(715, 15)">
      <circle cx="10" cy="9" r="6" fill="#f97316"/>
      <text x="24" y="13" class="mono step-text step-active">4. SYNCHRONIZE</text>
      <text x="134" y="13" class="sans" font-size="11" fill="#64748b">RabbitMQ</text>
    </g>
    <path d="M 940 24 L 960 24" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Stage 5: EVOLVE -->
    <g transform="translate(980, 15)">
      <circle cx="10" cy="9" r="6" fill="#10b981"/>
      <text x="24" y="13" class="mono step-text step-active">5. EVOLVE</text>
    </g>
  </g>
</svg>

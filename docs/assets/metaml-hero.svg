<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="hero-bg-glow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="1.0"/>
    </radialGradient>
    <radialGradient id="purple-flare" cx="15%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0"/>
    </radialGradient>
    <radialGradient id="cyan-flare" cx="85%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Linear Accents -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="75%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="card-wb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="card-tp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2d48" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#091e33" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="card-mq-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b1d0e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1f110a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="accent-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.55"/>
    </pattern>

    <!-- Arrow Marker -->
    <marker id="hero-arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="hero-arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fb923c" />
    </marker>
  </defs>

  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .hero-title { font-weight: 800; letter-spacing: -1.2px; }
    .hero-tag { font-weight: 500; letter-spacing: 0.3px; }
    .step-text { font-size: 11px; font-weight: 600; letter-spacing: 1.2px; fill: #94a3b8; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="440" rx="16" fill="url(#hero-bg-glow)"/>
  <rect width="1200" height="440" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="440" rx="16" fill="url(#purple-flare)"/>
  <rect width="1200" height="440" rx="16" fill="url(#cyan-flare)"/>
  <rect width="1200" height="440" rx="16" fill="none" stroke="url(#border-grad)" stroke-width="1.5"/>

  <!-- Top Badges / Subsystem Header -->
  <g transform="translate(60, 46)">
    <rect x="0" y="0" width="144" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" stroke-opacity="0.7"/>
    <circle cx="13" cy="13" r="4" fill="#8b5cf6"/>
    <text x="25" y="17" class="mono" font-size="10.5" fill="#c7d2fe" font-weight="600">RESEARCH CORE</text>

    <rect x="156" y="0" width="286" height="26" rx="13" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="170" cy="13" r="4" fill="#38bdf8"/>
    <text x="182" y="17" class="mono" font-size="10.5" fill="#bae6fd" font-weight="600">JAVA 24 • SPRING BOOT 4.1 • CAMUNDA 7.24</text>
  </g>

  <!-- Left: Main Branding / Typography -->
  <g transform="translate(60, 116)">
    <text x="0" y="34" class="sans hero-title" font-size="46" fill="url(#title-grad)">MetaML</text>
    <text x="0" y="70" class="sans" font-size="20" font-weight="600" fill="#e2e8f0" letter-spacing="-0.2px">
      Model-Driven Infrastructure for Executable, Synchronized Process Systems
    </text>

    <text x="0" y="110" class="sans hero-tag" font-size="14.5" fill="#94a3b8">
      Model processes, generate executable Target Platforms, and coordinate
    </text>
    <text x="0" y="132" class="sans hero-tag" font-size="14.5" fill="#94a3b8">
      Proxy/Twin execution through event-driven runtime infrastructure.
    </text>
  </g>

  <!-- Bottom: 5-Stage Lifecycle Rail -->
  <g transform="translate(60, 350)">
    <rect width="520" height="38" rx="19" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>

    <g transform="translate(30, 24)">
      <circle cx="0" cy="-4" r="4" fill="#c084fc"/>
      <text x="12" y="0" class="mono step-text" fill="#f1f5f9">MODEL</text>
      <text x="74" y="0" class="mono" font-size="11" fill="#64748b">→</text>

      <circle cx="106" cy="-4" r="4" fill="#818cf8"/>
      <text x="118" y="0" class="mono step-text" fill="#f1f5f9">SAVE</text>
      <text x="168" y="0" class="mono" font-size="11" fill="#64748b">→</text>

      <circle cx="200" cy="-4" r="4" fill="#38bdf8"/>
      <text x="212" y="0" class="mono step-text" fill="#f1f5f9">GENERATE</text>
      <text x="296" y="0" class="mono" font-size="11" fill="#64748b">→</text>

      <circle cx="328" cy="-4" r="4" fill="#34d399"/>
      <text x="340" y="0" class="mono step-text" fill="#f1f5f9">LAUNCH</text>
      <text x="406" y="0" class="mono" font-size="11" fill="#64748b">→</text>

      <circle cx="438" cy="-4" r="4" fill="#fb923c"/>
      <text x="450" y="0" class="mono step-text" fill="#f1f5f9">RUN</text>
    </g>
  </g>

  <!-- Right Side: Clean High-Level Architectural Emblem -->
  <g transform="translate(710, 60)">
    <!-- Ambient Backdrop Glow -->
    <rect x="0" y="0" width="430" height="320" rx="14" fill="#0b1120" fill-opacity="0.7" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Box 1: MetaML Workbench -->
    <g transform="translate(24, 20)">
      <rect width="382" height="66" rx="8" fill="url(#card-wb-grad)" stroke="#6366f1" stroke-width="1"/>
      <rect x="14" y="10" width="130" height="18" rx="9" fill="#312e81"/>
      <text x="79" y="22" class="mono" font-size="9" font-weight="700" fill="#c7d2fe" text-anchor="middle">AUTHORING &amp; CONTROL</text>
      <text x="14" y="46" class="sans" font-size="14" font-weight="700" fill="#f8fafc">MetaML Workbench</text>
      <text x="14" y="58" class="sans" font-size="9.5" fill="#94a3b8">BPMN Canvas • Process Catalog • Project Generator • Supervisor</text>
    </g>

    <!-- Connector: Generate & Launch -->
    <g transform="translate(215, 86)">
      <line x1="0" y1="0" x2="0" y2="28" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#hero-arrow-blue)"/>
      <rect x="-62" y="7" width="124" height="15" rx="3" fill="#090d16" stroke="#0284c7" stroke-width="0.7"/>
      <text x="0" y="18" class="mono" font-size="8" font-weight="700" fill="#7dd3fc" text-anchor="middle">GENERATE &amp; LAUNCH</text>
    </g>

    <!-- Box 2: Generated Target Platform -->
    <g transform="translate(24, 120)">
      <rect width="382" height="106" rx="8" fill="url(#card-tp-grad)" stroke="#0ea5e9" stroke-width="1.2"/>

      <!-- Card Header -->
      <rect x="14" y="10" width="168" height="18" rx="9" fill="#082f49"/>
      <text x="98" y="22" class="mono" font-size="9" font-weight="700" fill="#7dd3fc" text-anchor="middle">RUNTIME MICROSERVICE :PORT</text>
      <text x="14" y="44" class="sans" font-size="14" font-weight="700" fill="#f8fafc">Generated Target Platform</text>

      <!-- Internal Camunda + Proxy/Twin Badges -->
      <g transform="translate(14, 54)">
        <rect width="170" height="42" rx="5" fill="#090d16" stroke="#0284c7" stroke-width="0.8"/>
        <text x="10" y="18" class="sans" font-size="10.5" font-weight="700" fill="#38bdf8">Proxy Process</text>
        <text x="10" y="32" class="sans" font-size="8.5" fill="#94a3b8">Production Workflow Tasks</text>

        <rect x="184" y="0" width="170" height="42" rx="5" fill="#090d16" stroke="#10b981" stroke-width="0.8"/>
        <text x="194" y="18" class="sans" font-size="10.5" font-weight="700" fill="#34d399">Digital Twin</text>
        <text x="194" y="32" class="sans" font-size="8.5" fill="#94a3b8">Automated Shadow Replica</text>

        <!-- Sync Symbol between Proxy and Twin -->
        <circle cx="177" cy="21" r="9" fill="#0f172a" stroke="#6366f1" stroke-width="1"/>
        <text x="177" y="24" class="sans" font-size="10" font-weight="700" fill="#c084fc" text-anchor="middle">⇄</text>
      </g>
    </g>

    <!-- Connector: AMQP Transport -->
    <g transform="translate(215, 226)">
      <line x1="0" y1="0" x2="0" y2="24" stroke="#fb923c" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#hero-arrow-orange)"/>
      <rect x="-60" y="5" width="120" height="15" rx="3" fill="#090d16" stroke="#ea580c" stroke-width="0.7"/>
      <text x="0" y="16" class="mono" font-size="8" font-weight="700" fill="#fdba74" text-anchor="middle">AMQP TRANSPORT</text>
    </g>

    <!-- Box 3: External RabbitMQ Broker -->
    <g transform="translate(24, 256)">
      <rect width="382" height="46" rx="8" fill="url(#card-mq-grad)" stroke="#ea580c" stroke-width="1"/>
      <rect x="14" y="10" width="116" height="16" rx="8" fill="#431407"/>
      <text x="72" y="21" class="mono" font-size="8.5" font-weight="700" fill="#fed7aa" text-anchor="middle">EXTERNAL BROKER</text>
      <text x="140" y="23" class="sans" font-size="12" font-weight="700" fill="#ffedd5">RabbitMQ (AMQP 5672)</text>
      <text x="14" y="38" class="sans" font-size="9" fill="#fdba74">Durable Task &amp; Response Queues for Lockstep Handoffs</text>
    </g>
  </g>
</svg>

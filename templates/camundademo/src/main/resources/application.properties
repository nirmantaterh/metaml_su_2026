spring.application.name=camundademo

# Actuator - manage endpoints
management.endpoints.web.exposure.include=*
management.endpoint.shutdown.enabled=true
endpoints.shutdown.enabled=true

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
##(create, update, create-drop, validate)
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=update

# Camunda Primary DataSource Configuration - Default: H2 in-memory (local dev); Override via SPRING_DATASOURCE_* env vars for durable production relational persistence
spring.datasource.camunda.url=${SPRING_DATASOURCE_CAMUNDA_URL:${SPRING_DATASOURCE_URL:jdbc:h2:mem:process-engine;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.camunda.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.camunda.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.camunda.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.url=${spring.datasource.camunda.url}
spring.datasource.username=${spring.datasource.camunda.username}
spring.datasource.password=${spring.datasource.camunda.password}
spring.datasource.driver-class-name=${spring.datasource.camunda.driver-class-name}

# Camunda Process Engine Configuration
camunda.bpm.process-engine-name=engine
camunda.bpm.database-schema-update=${CAMUNDA_BPM_DATABASE_SCHEMA_UPDATE:true}
camunda.bpm.skip-isolation-level-check=true
camunda.bpm.history-level=full
camunda.bpm.enforce-history-time-to-live=false
camunda.bpm.job-executor-activate=false
# (ORIGINAL) camunda.bpm.enforce-history-time-to-live=true

# Location of BPMN process files
camunda.bpm.deployment-resource-pattern=classpath*:/processes/*.bpmn

# Disable webapp index redirect so the static dashboard index.html is served at root.
camunda.bpm.webapp.index-redirect-enabled=false

# Inter-component messaging configuration (disabled by default).
metaml.messaging.enabled=false
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:${spring.rabbitmq.host:localhost}:${spring.rabbitmq.port:5672}}
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.publisher-confirm-type=simple
spring.rabbitmq.listener.simple.default-requeue-rejected=false